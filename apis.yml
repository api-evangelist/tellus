aid: tellus
name: Tellus
description: >-
  Tellus is a consumer fintech company whose mobile app pairs high-yield savings
  tools with real-estate-backed lending and property management. Members earn
  competitive rates on cash held in Tellus accounts, funded by the company's
  portfolio of residential real-estate loans, with deposits held at FDIC-insured
  partner banks. The app also offers a mobile wallet, a business wallet, and
  property-management tooling for landlords and property owners. Tellus is a
  private, venture-backed startup (an a16z portfolio company); it operates as a
  direct-to-consumer mobile product and does not publish a public developer API,
  developer portal, or API documentation.
